apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: watermark-app
  namespace: watermark
  labels:
    # kube-prometheus-stack's Prometheus is configured to auto-discover
    # ServiceMonitors across all namespaces by default; no extra label
    # needed beyond matching the Service selector below.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: watermark-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
